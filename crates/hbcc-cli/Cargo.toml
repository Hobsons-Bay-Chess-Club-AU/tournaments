[package]
name = "hbcc-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hbcc"
path = "src/main.rs"

[dependencies]
hbcc-core = { path = "../hbcc-core" }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
dotenvy = "0.15"
env_logger = "0.11"
log = "0.4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.14"
assert_cmd = "2.0"
predicates = "3.1"

