name: Build & Release HBCC FTP Server

on:
  push:
    branches:
      - main
      - feat/ftp-server
    paths:
      - 'ftp-server/**'
      - '.github/workflows/ftp-server-release.yml'
    tags:
      - 'ftp-v*'
  workflow_dispatch:

concurrency:
  group: ftp-server-release
  cancel-in-progress: true

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'ftp-server/package-lock.json'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.9.1"

      - name: Configure sccache
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'ftp-server/src-tauri -> target'
          key: ${{ matrix.platform }}
          cache-all-crates: 'true'

      - name: Extract version
        id: pkg
        shell: bash
        working-directory: ftp-server
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=ftp-v$VERSION" >> $GITHUB_ENV
          fi

      - name: Install dependencies
        run: cd ftp-server && npm ci

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Sidecar Binaries
        shell: bash
        working-directory: ftp-server
        run: |
          mkdir -p src-tauri/binaries
          if [ "${{ matrix.platform }}" = "macos-latest" ]; then
            bun build parser/run-parser.mjs --compile --target=bun-darwin-arm64 --outfile src-tauri/binaries/vega-parser-aarch64-apple-darwin
            bun build parser/run-parser.mjs --compile --target=bun-darwin-x64 --outfile src-tauri/binaries/vega-parser-x86_64-apple-darwin
            lipo -create -output src-tauri/binaries/vega-parser-universal-apple-darwin src-tauri/binaries/vega-parser-aarch64-apple-darwin src-tauri/binaries/vega-parser-x86_64-apple-darwin
          elif [ "${{ matrix.platform }}" = "windows-latest" ]; then
            bun build parser/run-parser.mjs --compile --target=bun-windows-x64 --outfile src-tauri/binaries/vega-parser-x86_64-pc-windows-msvc.exe
          fi

      - name: Run Tests
        if: matrix.platform == 'macos-latest'
        shell: bash
        working-directory: ftp-server
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      - name: Build and Publish Tauri Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_TABLE: ${{ secrets.SUPABASE_TABLE }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        with:
          projectPath: './ftp-server'
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'HBCC FTP Server ${{ env.RELEASE_TAG }}'
          releaseBody: 'Automated release for HBCC Vega Tournament FTP & Preview Server.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Show sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats
