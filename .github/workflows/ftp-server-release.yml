name: Build & Release HBCC FTP Server

on:
  push:
    branches:
      - main
    paths:
      - 'ftp-server/**'
      - '.github/workflows/ftp-server-release.yml'
    tags:
      - 'ftp-v*'
  workflow_dispatch:

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Extract version
        id: pkg
        shell: bash
        working-directory: ftp-server
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "RELEASE_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          else
            echo "RELEASE_TAG=ftp-v$VERSION" >> $GITHUB_ENV
          fi

      - name: Install dependencies
        working-directory: ftp-server
        run: npm install

      - name: Run Tests
        shell: bash
        working-directory: ftp-server
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build and Publish Tauri Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        with:
          projectPath: './ftp-server'
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'HBCC FTP Server ${{ env.RELEASE_TAG }}'
          releaseBody: 'Automated release for HBCC Vega Tournament FTP & Preview Server.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
